<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/chat}">
<head><title>Chat</title></head>
<body>
<span layout:fragment="page-title">Chat</span>
<div layout:fragment="content">
  <div th:if="${error}" class="alert alert-error" style="margin:1rem;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span th:text="${error}">Error</span>
  </div>

  <div class="chat-layout">
    <div class="chat-sidebar">
      <div style="padding:0.85rem 1rem;font-weight:600;font-size:0.9rem;border-bottom:1px solid var(--border);">
        My Chats
      </div>
      <div th:if="${chats != null and !chats.isEmpty()}">
        <a th:each="chat : ${chats}"
           th:href="@{/chat/{id}(id=${chat.id})}"
           class="chat-item">
          <div class="chat-item-title" th:text="${chat.title ?: 'Chat'}">Chat</div>
          <div class="chat-item-last" th:text="${chat.lastMessage ?: 'No messages yet'}">Last message</div>
          <div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.1rem;"
               th:text="${chat.memberCount + ' member' + (chat.memberCount != 1 ? 's' : '')}">1 member</div>
        </a>
      </div>
      <div th:unless="${chats != null and !chats.isEmpty()}" class="empty-state" style="padding:2rem 1rem;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>No chats yet.</p>
      </div>
    </div>

    <div class="chat-main" style="justify-content:center;align-items:center;color:var(--text-muted);font-size:0.9rem;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;margin-bottom:1rem;opacity:0.3;">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>Select a chat to start messaging</p>
    </div>
  </div>
</div>
</body>
</html>
