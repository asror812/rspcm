<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat — RSPCM</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">

  <th:block th:if="${sidebarRole == 'admin'}">
    <div th:replace="~{fragments/admin-sidebar :: adminSidebar('chat')}"></div>
  </th:block>
  <th:block th:if="${sidebarRole == 'teacher'}">
    <div th:replace="~{fragments/teacher-sidebar :: teacherSidebar('chat')}"></div>
  </th:block>
  <th:block th:if="${sidebarRole != 'admin' and sidebarRole != 'teacher'}">
    <div th:replace="~{fragments/student-sidebar :: studentSidebar('chat')}"></div>
  </th:block>

  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>

  <div class="main-content" style="padding:0;">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Chat</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'U'}">U</div>
      </div>
    </header>

    <div th:if="${error}" class="alert alert-error" style="margin:1rem;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span th:text="${error}">Error</span>
    </div>

    <div class="chat-layout">
      <!-- Chat list sidebar -->
      <div class="chat-sidebar">
        <div style="padding:0.85rem 1rem;font-weight:600;font-size:0.9rem;border-bottom:1px solid var(--border);">
          My Chats
        </div>
        <div th:if="${chats != null and !chats.isEmpty()}">
          <a th:each="chat : ${chats}"
             th:href="@{/chat/{id}(id=${chat.id})}"
             class="chat-item">
            <div class="chat-item-title" th:text="${chat.title ?: 'Chat'}">Chat</div>
            <div class="chat-item-last" th:text="${chat.lastMessage ?: 'No messages yet'}">Last message</div>
            <div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.1rem;">
              <span style="font-size:0.7rem;color:var(--text-muted);"
                    th:text="${chat.memberCount + ' member' + (chat.memberCount != 1 ? 's' : '')}">1 member</span>
            </div>
          </a>
        </div>
        <div th:unless="${chats != null and !chats.isEmpty()}" class="empty-state" style="padding:2rem 1rem;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <p>No chats yet.</p>
        </div>
      </div>

      <!-- Empty right area -->
      <div class="chat-main" style="justify-content:center;align-items:center;color:var(--text-muted);font-size:0.9rem;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;margin-bottom:1rem;opacity:0.3;">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>Select a chat to start messaging</p>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
