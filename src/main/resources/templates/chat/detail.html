<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/chat}">
<head><title>Chat</title></head>
<body>
<span layout:fragment="page-title">Chat</span>

<div layout:fragment="content">
  <div th:if="${error}" class="alert alert-error" style="margin:1rem;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span th:text="${error}">Error</span>
  </div>

  <div class="chat-layout">
    <div class="chat-sidebar">
      <div style="padding:0.85rem 1rem;font-weight:600;font-size:0.9rem;border-bottom:1px solid var(--border);">
        My Chats
      </div>
      <div th:if="${chats != null and !chats.isEmpty()}">
        <a th:each="chat : ${chats}"
           th:href="@{/chat/{id}(id=${chat.id})}"
           th:classappend="${chat.id == chatId} ? ' active' : ''"
           class="chat-item">
          <div class="chat-item-title" th:text="${chat.title ?: 'Chat'}">Chat</div>
          <div class="chat-item-last" th:text="${chat.lastMessage ?: 'No messages yet'}">Last message</div>
          <div style="font-size:0.7rem;color:var(--text-muted);margin-top:0.1rem;"
               th:text="${chat.memberCount + ' member' + (chat.memberCount != 1 ? 's' : '')}">1 member</div>
        </a>
      </div>
      <div th:unless="${chats != null and !chats.isEmpty()}" class="empty-state" style="padding:2rem 1rem;">
        <p>No chats.</p>
      </div>
    </div>

    <div class="chat-main">
      <div class="chat-messages" id="chatMessages">
        <div th:if="${messages != null}" th:each="msg : ${messages}"
             th:class="${msg.mine} ? 'chat-message mine' : 'chat-message theirs'">
          <div class="chat-message-bubble" th:text="${msg.content}">Message</div>
          <div class="chat-message-meta" th:text="${msg.senderName}">Sender</div>
        </div>
        <div th:if="${messages == null or messages.isEmpty()}"
             style="text-align:center;color:var(--text-muted);padding:2rem;font-size:0.875rem;">
          No messages yet. Be the first to say hello!
        </div>
      </div>
      <div class="chat-input-row">
        <input type="text" id="msgInput" class="chat-input" placeholder="Type a message..."
               onkeydown="if(event.key==='Enter')sendMessage()"/>
        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>
</div>

<th:block layout:fragment="scripts">
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script th:inline="javascript">
const JWT_TOKEN = /*[[${jwtToken}]]*/ '';
const CHAT_ID = /*[[${chatId}]]*/ 0;
const MY_EMAIL = /*[[${currentUser?.email}]]*/ '';
</script>
<script>
const messagesEl = document.getElementById('chatMessages');
function scrollToBottom() { if (messagesEl) messagesEl.scrollTop = messagesEl.scrollHeight; }
scrollToBottom();

function appendMessage(msg) {
  const isMine = msg.mine || msg.senderEmail === MY_EMAIL;
  const div = document.createElement('div');
  div.className = 'chat-message ' + (isMine ? 'mine' : 'theirs');
  const bubble = document.createElement('div');
  bubble.className = 'chat-message-bubble';
  bubble.textContent = msg.content || msg.message || '';
  const meta = document.createElement('div');
  meta.className = 'chat-message-meta';
  meta.textContent = msg.senderName || '';
  div.appendChild(bubble);
  div.appendChild(meta);
  messagesEl.appendChild(div);
  scrollToBottom();
}

if (CHAT_ID && JWT_TOKEN) {
  const client = new StompJs.Client({
    brokerURL: 'ws://' + location.host + '/ws',
    connectHeaders: { Authorization: 'Bearer ' + JWT_TOKEN },
    reconnectDelay: 5000,
    onConnect: function() {
      client.subscribe('/topic/chats/' + CHAT_ID + '/messages', function(frame) {
        try { appendMessage(JSON.parse(frame.body)); } catch(e) {}
      });
    },
    onStompError: function(frame) { console.warn('STOMP error', frame); }
  });
  client.activate();
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  fetch('/api/chats/' + CHAT_ID + '/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  }).catch(function(e) { console.warn('Send error', e); });
  input.value = '';
}
</script>
</th:block>
</body>
</html>
