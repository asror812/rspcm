<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head><title>Study Groups</title></head>
<body>
<span layout:fragment="page-title">Study Groups</span>
    <main layout:fragment="content" class="page-content">
      <div class="page-header">
        <h1>Study Groups</h1>
        <p>Overview of all study groups</p>
        <a th:href="@{/admin/groups/new}" class="btn btn-primary">+ New Group</a>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${error}">Error</span>
      </div>

      <div th:if="${groups != null and !groups.isEmpty()}" class="groups-grid">
        <div th:each="group : ${groups}" class="group-card">
          <div class="group-card-header">
            <div class="group-name" th:text="${group.name}">Group Name</div>
            <span class="badge badge-primary" th:text="${group.language}">LANG</span>
          </div>
          <div th:if="${group.description}" class="group-description" th:text="${group.description}">Description</div>
          <div class="action-row" style="margin-bottom:0.5rem">
            <a th:href="@{/admin/groups/{id}(id=${group.id})}" class="btn btn-sm btn-secondary">View</a>
            <a th:href="@{/admin/groups/{id}/edit(id=${group.id})}" class="btn btn-sm btn-primary">Edit</a>
            <form th:action="@{/admin/groups/{id}/delete(id=${group.id})}" method="post" style="display:inline">
              <button type="submit" class="btn btn-sm btn-destructive"
                      onclick="return confirm('Delete this group?')">Delete</button>
            </form>
          </div>
          <div class="group-meta">
            <div class="group-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              <span th:text="${group.students?.size() + ' students'}">0 students</span>
            </div>
            <div class="group-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a9.5 9.5 0 0 1 13 0"/></svg>
              <span th:text="${group.teachers?.size() + ' teachers'}">0 teachers</span>
            </div>
            <div class="group-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span th:text="${group.subjects?.size() + ' subjects'}">0 subjects</span>
            </div>
          </div>
        </div>
      </div>

      <div th:unless="${groups != null and !groups.isEmpty()}" class="card">
        <div class="card-body">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <p>No study groups found</p>
          </div>
        </div>
      </div>
    </main>
</body>
</html>
