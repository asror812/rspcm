<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head><title>Teachers</title></head>
<body>
<span layout:fragment="page-title">Teachers</span>
    <main layout:fragment="content" class="page-content">
      <div class="page-header">
        <h1>Teachers</h1>
        <p>Manage all teacher accounts</p>
        <a th:href="@{/admin/users/new}" class="btn btn-primary">+ New User</a>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${error}">Error</span>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">All Users</span>
          <span class="badge badge-muted" th:text="${users?.totalElements + ' total'}">0 total</span>
        </div>
        <div class="table-wrapper">
          <table th:if="${users != null and !users.isEmpty()}">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Roles</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="user, stat : ${users}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${user.firstName + ' ' + user.lastName}">Name</td>
                <td th:text="${user.email}">email@example.com</td>
                <td>
                  <span th:each="role : ${user.roles}"
                        class="badge badge-info"
                        th:text="${#strings.replace(role, 'ROLE_', '')}">ROLE</span>
                </td>
                <td>
                  <span th:if="${user.enabled}" class="badge badge-success">Active</span>
                  <span th:unless="${user.enabled}" class="badge badge-muted">Inactive</span>
                </td>
                <td>
                  <div class="action-row">
                    <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-secondary">View</a>
                    <a th:href="@{/admin/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-primary">Edit</a>
                    <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" style="display:inline">
                      <button type="submit" class="btn btn-sm btn-destructive"
                              onclick="return confirm('Delete this user?')">Delete</button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <div th:unless="${users != null and !users.isEmpty()}" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M5.5 21a9.5 9.5 0 0 1 13 0"/></svg>
            <p>No teachers found</p>
          </div>
        </div>
      </div>
    </main>
</body>
</html>
