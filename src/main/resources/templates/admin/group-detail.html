<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Group Detail — RSPCM Admin</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{fragments/admin-sidebar :: adminSidebar('groups')}"></div>

  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Group Detail</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'AD'}">AD</div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <h1 th:text="${group.name}">Group Name</h1>
        <div class="action-row">
          <a th:href="@{/admin/groups}" class="btn btn-secondary">Back</a>
          <a th:href="@{/admin/groups/{id}/edit(id=${group.id})}" class="btn btn-primary">Edit</a>
          <form th:action="@{/admin/groups/{id}/delete(id=${group.id})}" method="post" style="display:inline">
            <button type="submit" class="btn btn-destructive"
                    onclick="return confirm('Delete this group?')">Delete</button>
          </form>
        </div>
      </div>

      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header"><span class="card-title">Details</span></div>
        <div class="card-body" style="padding:1.5rem">
          <div class="detail-grid">
            <div class="detail-field">
              <span class="detail-label">Name</span>
              <span class="detail-value" th:text="${group.name}">-</span>
            </div>
            <div class="detail-field">
              <span class="detail-label">Language</span>
              <span class="badge badge-primary" th:text="${group.language}">-</span>
            </div>
            <div class="detail-field" style="grid-column:1/-1">
              <span class="detail-label">Description</span>
              <span class="detail-value" th:text="${group.description ?: 'No description'}">-</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header">
          <span class="card-title">Subjects</span>
          <span class="badge badge-muted" th:text="${group.subjects?.size() + ' subjects'}">0</span>
        </div>
        <div class="card-body" style="padding:1rem 1.5rem">
          <div th:if="${group.subjects != null and !group.subjects.isEmpty()}" class="subjects-list">
            <span th:each="subject : ${group.subjects}" class="badge badge-primary" th:text="${subject.name}">Subject</span>
          </div>
          <div th:unless="${group.subjects != null and !group.subjects.isEmpty()}" class="badge badge-muted">No subjects</div>
        </div>
      </div>

      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-header">
          <span class="card-title">Teachers</span>
          <span class="badge badge-muted" th:text="${group.teachers?.size() + ' teachers'}">0</span>
        </div>
        <div class="card-body" style="padding:1rem 1.5rem">
          <div th:if="${group.teachers != null and !group.teachers.isEmpty()}">
            <span th:each="teacher : ${group.teachers}" class="badge badge-info" style="margin-right:4px"
                  th:text="${teacher.firstName + ' ' + teacher.lastName}">Teacher</span>
          </div>
          <div th:unless="${group.teachers != null and !group.teachers.isEmpty()}" class="badge badge-muted">No teachers</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Students</span>
          <span class="badge badge-muted" th:text="${group.students?.size() + ' students'}">0</span>
        </div>
        <div class="table-wrapper">
          <table th:if="${group.students != null and !group.students.isEmpty()}">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="student, stat : ${group.students}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${student.firstName + ' ' + student.lastName}">Name</td>
                <td th:text="${student.email}">email</td>
              </tr>
            </tbody>
          </table>
          <div th:unless="${group.students != null and !group.students.isEmpty()}" class="empty-state" style="padding:2rem">
            <p>No students in this group</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
