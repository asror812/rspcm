<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Practices — RSPCM Admin</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{fragments/admin-sidebar :: adminSidebar('practices')}"></div>

  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Practices</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'AD'}">AD</div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <h1>Practices</h1>
        <p>All practice assignments across the system</p>
        <a th:href="@{/admin/practices/new}" class="btn btn-primary">+ New Practice</a>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${error}">Error</span>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">All Practices</span>
          <span class="badge badge-muted" th:text="${practices?.totalElements + ' total'}">0 total</span>
        </div>
        <div class="table-wrapper">
          <table th:if="${practices != null and !practices.isEmpty()}">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Work Mode</th>
                <th>Submission Types</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="practice, stat : ${practices}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${practice.name}">Name</td>
                <td th:text="${practice.subject?.name ?: '-'}">Subject</td>
                <td><span class="badge badge-primary" th:text="${practice.workMode}">MODE</span></td>
                <td>
                  <span th:each="st : ${practice.allowedSubmissionTypes}" class="badge badge-muted" style="margin-right:2px" th:text="${st}">TYPE</span>
                </td>
                <td>
                  <div class="action-row">
                    <a th:href="@{/admin/practices/{id}(id=${practice.id})}" class="btn btn-sm btn-secondary">View</a>
                    <a th:href="@{/admin/practices/{id}/edit(id=${practice.id})}" class="btn btn-sm btn-primary">Edit</a>
                    <form th:action="@{/admin/practices/{id}/delete(id=${practice.id})}" method="post" style="display:inline">
                      <button type="submit" class="btn btn-sm btn-destructive"
                              onclick="return confirm('Delete this practice?')">Delete</button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <div th:unless="${practices != null and !practices.isEmpty()}" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <p>No practices found. <a th:href="@{/admin/practices/new}" style="color:var(--primary)">Create your first practice.</a></p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
