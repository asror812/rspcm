<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head><title>Subjects</title></head>
<body>
<span layout:fragment="page-title">Subjects</span>
    <main layout:fragment="content" class="page-content">
      <div class="page-header">
        <h1>Subjects</h1>
        <p>Manage academic subjects</p>
        <a th:href="@{/admin/subjects/new}" class="btn btn-primary">+ New Subject</a>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        <span th:text="${error}">Error</span>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">All Subjects</span>
          <span class="badge badge-muted" th:text="${subjects?.totalElements + ' total'}">0 total</span>
        </div>
        <div class="table-wrapper">
          <table th:if="${subjects != null and !subjects.isEmpty()}">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="subject, stat : ${subjects}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${subject.name}">Name</td>
                <td th:text="${subject.description ?: '-'}">Desc</td>
                <td>
                  <div class="action-row">
                    <a th:href="@{/admin/subjects/{id}/edit(id=${subject.id})}" class="btn btn-sm btn-primary">Edit</a>
                    <form th:action="@{/admin/subjects/{id}/delete(id=${subject.id})}" method="post" style="display:inline">
                      <button type="submit" class="btn btn-sm btn-destructive"
                              onclick="return confirm('Delete this subject?')">Delete</button>
                    </form>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <div th:unless="${subjects != null and !subjects.isEmpty()}" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <p>No subjects yet. <a th:href="@{/admin/subjects/new}" style="color:var(--primary)">Create the first subject.</a></p>
          </div>
        </div>
      </div>
    </main>
</body>
</html>
