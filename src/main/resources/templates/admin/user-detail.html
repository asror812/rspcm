<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/admin}">
<head><title>User Detail</title></head>
<body>
<span layout:fragment="page-title">User Detail</span>
    <main layout:fragment="content" class="page-content">
      <div class="page-header">
        <h1 th:text="${u.firstName + ' ' + u.lastName}">User Name</h1>
        <div class="action-row">
          <a th:href="@{/admin/students}" class="btn btn-secondary">Back</a>
          <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-primary">Edit</a>
          <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post" style="display:inline">
            <button type="submit" class="btn btn-destructive"
                    onclick="return confirm('Delete this user?')">Delete</button>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-body" style="padding:1.5rem">
          <div class="detail-grid">
            <div class="detail-field">
              <span class="detail-label">First Name</span>
              <span class="detail-value" th:text="${u.firstName}">-</span>
            </div>
            <div class="detail-field">
              <span class="detail-label">Last Name</span>
              <span class="detail-value" th:text="${u.lastName}">-</span>
            </div>
            <div class="detail-field">
              <span class="detail-label">Email</span>
              <span class="detail-value" th:text="${u.email}">-</span>
            </div>
            <div class="detail-field">
              <span class="detail-label">Status</span>
              <span th:if="${u.enabled}" class="badge badge-success">Active</span>
              <span th:unless="${u.enabled}" class="badge badge-muted">Inactive</span>
            </div>
            <div class="detail-field">
              <span class="detail-label">Roles</span>
              <div>
                <span th:each="role : ${u.roles}" class="badge badge-primary" style="margin-right:4px"
                      th:text="${#strings.replace(role, 'ROLE_', '')}">ROLE</span>
              </div>
            </div>
            <div class="detail-field">
              <span class="detail-label">Deleted</span>
              <span th:if="${u.deleted}" class="badge badge-destructive">Yes</span>
              <span th:unless="${u.deleted}" class="badge badge-muted">No</span>
            </div>
          </div>
        </div>
      </div>
    </main>
</body>
</html>
