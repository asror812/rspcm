<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RSPCM — Sign In</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card">

    <!-- Header -->
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4l6 2.67V11c0 3.87-2.67 7.5-6 8.93C8.67 18.5 6 14.87 6 11V7.67L12 5z"/>
        </svg>
      </div>
      <h1 class="login-title">RSPCM</h1>
      <p class="login-subtitle">Research &amp; Practice Control Management</p>
    </div>

    <!-- Error message -->
    <div th:if="${error}" class="login-error" th:text="${error}"></div>
    <div th:if="${param.error}" class="login-error">Authentication failed. Please try again.</div>

    <!-- Login form -->
    <form class="login-form" method="post" th:action="@{/login}">
      <div class="form-group">
        <label for="identifier" class="form-label">Email or Username</label>
        <input
          id="identifier"
          name="identifier"
          type="text"
          class="form-input"
          placeholder="Enter your email"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          class="form-input"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="login-btn">Sign In</button>
    </form>

  </div>
</div>
</body>
</html>
