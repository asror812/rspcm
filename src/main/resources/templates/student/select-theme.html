<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Select Theme — RSPCM Student</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/student-sidebar :: studentSidebar('select-theme')}"></div>
  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Select Practice Theme</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'ST'}">ST</div>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <h1>Select Practice Theme</h1>
        <p>Choose a practice topic to work on</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Error</span>
      </div>

      <div th:if="${exams != null and !exams.isEmpty()}">
        <div th:each="exam : ${exams}" class="card" style="margin-bottom:1.5rem;">
          <div class="card-header">
            <span class="card-title" th:text="${exam.title}">Exam</span>
            <span class="badge badge-primary">PRACTICE</span>
          </div>
          <div class="card-body" th:if="${exam.practices != null and !exam.practices.isEmpty()}">
            <div th:each="practice : ${exam.practices}"
                 style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding:0.75rem 0;border-bottom:1px solid var(--border);">
              <div>
                <div style="font-weight:500;" th:text="${practice.name}">Practice</div>
                <span class="badge badge-muted" style="margin-top:0.25rem;" th:text="${practice.workMode}">MODE</span>
              </div>
              <a th:href="@{/student/exams/{id}(id=${exam.id})}" class="btn btn-primary btn-sm">View &amp; Select</a>
            </div>
          </div>
          <div class="card-body" th:unless="${exam.practices != null and !exam.practices.isEmpty()}">
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;">
              <p style="color:var(--text-muted);font-size:0.875rem);margin:0;">No practices listed yet.</p>
              <a th:href="@{/student/exams/{id}(id=${exam.id})}" class="btn btn-secondary btn-sm">View Exam</a>
            </div>
          </div>
        </div>
      </div>

      <div class="card" th:unless="${exams != null and !exams.isEmpty()}">
        <div class="card-body">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <p>No practice exams available for you yet.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
