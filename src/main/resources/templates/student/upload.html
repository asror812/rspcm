<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Report — RSPCM Student</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 3rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .upload-zone:hover {
      border-color: var(--primary);
      background: #ede9fe22;
    }

    .upload-zone svg {
      width: 48px;
      height: 48px;
      margin: 0 auto 1rem;
      color: var(--text-muted);
    }

    .upload-zone p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .upload-zone .upload-hint {
      font-size: 0.8rem;
      margin-top: 0.5rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/student-sidebar :: studentSidebar('upload')}"></div>
  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Upload Report</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'ST'}">ST</div>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <h1>Upload Report</h1>
        <p>Submit your practice report</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Error</span>
      </div>

      <div th:if="${participations != null and !participations.isEmpty()}">
        <div th:each="p : ${participations}" th:if="${p.status?.name() == 'PRACTICE_CHOSEN' and p.submission == null}"
             class="card" style="max-width:680px;margin-bottom:1.5rem;">
          <div class="card-header">
            <span class="card-title" th:text="${p.practice?.name ?: 'Submit Report'}">Submit Report</span>
            <span class="badge badge-success" th:text="${p.status}">STATUS</span>
          </div>
          <div class="card-body">
            <form th:action="@{/student/upload/{id}(id=${p.participationId})}" method="post">
              <div style="margin-bottom:1rem;">
                <label style="display:block;font-weight:500;margin-bottom:0.4rem;">Text Answer</label>
                <textarea name="textAnswer" class="chat-input"
                          style="width:100%;min-height:100px;border-radius:var(--radius);padding:0.5rem 0.75rem;border:1px solid var(--border);"
                          placeholder="Write your practice report or answer here..."></textarea>
              </div>
              <div style="margin-bottom:1rem;">
                <label style="display:block;font-weight:500;margin-bottom:0.4rem;">File URL (optional)</label>
                <input type="text" name="fileUrl" class="chat-input"
                       style="width:100%;border-radius:var(--radius);padding:0.5rem 0.75rem;border:1px solid var(--border);"
                       placeholder="https://drive.google.com/... or other file link"/>
              </div>
              <button type="submit" class="btn btn-primary">Submit Report</button>
            </form>
          </div>
        </div>
      </div>

      <div class="card" th:unless="${participations != null and participations.stream().anyMatch(p -> p.status?.name() == 'PRACTICE_CHOSEN' and p.submission == null)}">
        <div class="card-body">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polyline points="16 16 12 12 8 16"/>
              <line x1="12" y1="12" x2="12" y2="21"/>
              <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
            </svg>
            <p>No participations ready for submission.
              <a th:href="@{/student/select-theme}" style="color:var(--primary)">Select a practice theme</a> first.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
