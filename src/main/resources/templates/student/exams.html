<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Exams — RSPCM Student</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/student-sidebar :: studentSidebar('exams')}"></div>
  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">My Exams</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'ST'}">ST</div>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <h1>My Exams</h1>
        <p>All exams assigned to you</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${error}">Error</span>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Exams</span>
          <span class="badge badge-muted" th:text="${exams?.totalElements + ' total'}">0 total</span>
        </div>
        <div class="table-wrapper">
          <table th:if="${exams != null and !exams.isEmpty()}">
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Subject</th>
                <th>Type</th>
                <th>Dates</th>
                <th>My Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="exam, stat : ${exams}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${exam.title}">Title</td>
                <td th:text="${exam.subject?.name ?: '-'}">Subject</td>
                <td><span class="badge badge-primary" th:text="${exam.type}">TYPE</span></td>
                <td>
                  <span th:text="${exam.startAt != null ? #temporals.format(exam.startAt, 'dd MMM') : '?'}">Start</span>
                  <span> &rarr; </span>
                  <span th:text="${exam.endAt != null ? #temporals.format(exam.endAt, 'dd MMM yyyy') : '?'}">End</span>
                </td>
                <td>
                  <span class="badge"
                    th:classappend="${exam.myStatus == 'NOT_STARTED'} ? 'badge-muted' :
                                    (${exam.myStatus == 'IN_PROGRESS'} ? 'badge-warning' :
                                    (${exam.myStatus == 'SUBMITTED'} ? 'badge-primary' : 'badge-success'))"
                    th:text="${exam.myStatus ?: 'NOT_STARTED'}">NOT_STARTED</span>
                </td>
                <td>
                  <a th:href="@{/student/exams/{id}(id=${exam.id})}" class="btn btn-sm btn-secondary">View</a>
                </td>
              </tr>
            </tbody>
          </table>
          <div th:unless="${exams != null and !exams.isEmpty()}" class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
            <p>No exams assigned to you yet.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
