<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calendar — RSPCM Student</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/student-sidebar :: studentSidebar('calendar')}"></div>
  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Practice Calendar</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'ST'}">ST</div>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <h1>Exam Calendar</h1>
        <p>All your exams ordered by date</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Error</span>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Upcoming Exams</span>
          <span class="badge badge-muted" th:text="${exams?.totalElements ?: 0} + ' total'">0 total</span>
        </div>
        <div class="table-wrapper" th:if="${exams != null and !exams.isEmpty()}">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Subject</th>
                <th>Start</th>
                <th>End</th>
                <th>My Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="exam : ${exams}">
                <td>
                  <a th:href="@{/student/exams/{id}(id=${exam.id})}" style="color:var(--primary);font-weight:500;"
                     th:text="${exam.title}">Title</a>
                </td>
                <td><span class="badge badge-primary" th:text="${exam.type}">TYPE</span></td>
                <td th:text="${exam.subject?.name ?: '-'}">Subject</td>
                <td th:text="${exam.startAt != null ? #temporals.format(exam.startAt, 'dd MMM yyyy HH:mm') : '-'}">-</td>
                <td th:text="${exam.endAt != null ? #temporals.format(exam.endAt, 'dd MMM yyyy HH:mm') : '-'}">-</td>
                <td>
                  <span class="badge"
                        th:classappend="${exam.myStatus == 'NOT_STARTED'} ? 'badge-muted' :
                                        (${exam.myStatus == 'IN_PROGRESS'} ? 'badge-warning' :
                                        (${exam.myStatus == 'SUBMITTED'} ? 'badge-primary' : 'badge-success'))"
                        th:text="${exam.myStatus ?: 'NOT_STARTED'}">NOT_STARTED</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-body" th:unless="${exams != null and !exams.isEmpty()}">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <p>No exams found. Your calendar is clear!</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
