<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submission Status — RSPCM Student</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/student-sidebar :: studentSidebar('status')}"></div>
  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Submission Status</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'ST'}">ST</div>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <h1>Submission Status</h1>
        <p>Track the status of your practice and exam submissions</p>
      </div>

      <!-- Status Legend -->
      <div class="card" style="margin-bottom:1rem;">
        <div class="card-header">
          <span class="card-title">Status Guide</span>
        </div>
        <div class="card-body">
          <div style="display:flex;flex-wrap:wrap;gap:1rem;align-items:center;">
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span class="badge badge-muted">NOT_STARTED</span>
              <span style="font-size:0.8rem;color:var(--text-muted)">Not yet submitted</span>
            </div>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span class="badge badge-warning">SUBMITTED</span>
              <span style="font-size:0.8rem;color:var(--text-muted)">Awaiting review</span>
            </div>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span class="badge badge-destructive">RETURNED</span>
              <span style="font-size:0.8rem;color:var(--text-muted)">Returned for revision</span>
            </div>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span class="badge badge-success">GRADED</span>
              <span style="font-size:0.8rem;color:var(--text-muted)">Graded and approved</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <p>No submissions found. <a th:href="@{/student/upload}" style="color:var(--primary)">Upload your first report.</a></p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
