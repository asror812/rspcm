<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Dashboard — RSPCM</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">

  <div th:replace="~{fragments/student-sidebar :: studentSidebar('dashboard')}"></div>

  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Dashboard</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'ST'}">ST</div>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <h1 th:text="'Hello, ' + ${currentUser?.firstName} + '!'">Hello!</h1>
        <p>Your academic overview</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${error}">Error</span>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">My Groups</div>
            <div class="stat-value" th:text="${groups?.size() ?: 0}">0</div>
          </div>
          <div class="stat-icon stat-icon-blue">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">Subjects</div>
            <div class="stat-value" th:text="${dashboard?.subjects?.size() ?: 0}">0</div>
          </div>
          <div class="stat-icon stat-icon-purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">Active Practices</div>
            <div class="stat-value" th:text="${dashboard?.practices?.size() ?: 0}">0</div>
          </div>
          <div class="stat-icon stat-icon-yellow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">Upcoming Exams</div>
            <div class="stat-value" th:text="${dashboard?.exams?.size() ?: 0}">0</div>
          </div>
          <div class="stat-icon stat-icon-green">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          </div>
        </div>
      </div>

      <!-- Subjects & Tasks -->
      <div class="dashboard-grid">

        <!-- Subjects -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">My Subjects</span>
          </div>
          <div class="card-body">
            <div th:if="${dashboard?.subjects != null and !dashboard.subjects.isEmpty()}" class="subjects-list">
              <span th:each="subject : ${dashboard.subjects}"
                    class="badge badge-primary"
                    th:text="${subject.name}">Subject</span>
            </div>
            <div th:unless="${dashboard?.subjects != null and !dashboard.subjects.isEmpty()}" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <p>No subjects yet. Join a group to see your subjects.</p>
            </div>
          </div>
        </div>

        <!-- Upcoming Tasks -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Upcoming Tasks</span>
          </div>
          <div class="card-body">
            <div th:if="${(dashboard?.practices?.size() ?: 0) + (dashboard?.exams?.size() ?: 0) > 0}" class="task-list">
              <div th:each="task : ${dashboard?.practices}" class="task-item">
                <div class="task-item-info">
                  <div class="task-item-title" th:text="${task.title}">Practice</div>
                  <div class="task-item-deadline"
                       th:text="${task.deadline != null ? 'Due: ' + #temporals.format(task.deadline, 'dd MMM yyyy') : 'No deadline'}">Deadline</div>
                </div>
                <span class="badge badge-warning">Practice</span>
              </div>
              <div th:each="task : ${dashboard?.exams}" class="task-item">
                <div class="task-item-info">
                  <div class="task-item-title" th:text="${task.title}">Exam</div>
                  <div class="task-item-deadline"
                       th:text="${task.deadline != null ? 'Due: ' + #temporals.format(task.deadline, 'dd MMM yyyy') : 'No deadline'}">Deadline</div>
                </div>
                <span class="badge badge-info" th:text="${task.type}">EXAM</span>
              </div>
            </div>
            <div th:unless="${(dashboard?.practices?.size() ?: 0) + (dashboard?.exams?.size() ?: 0) > 0}" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
              <p>No upcoming tasks. You're all caught up!</p>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
