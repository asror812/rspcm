<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Progress — RSPCM Teacher</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/teacher-sidebar :: teacherSidebar('progress')}"></div>
  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Student Progress</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'TC'}">TC</div>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <h1>Student Progress</h1>
        <p>Track student progress across practice exams</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Error</span>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Practice Exams</span>
          <span class="badge badge-muted" th:text="${exams?.totalElements ?: 0} + ' exams'">0 exams</span>
        </div>
        <div class="table-wrapper" th:if="${exams != null and !exams.isEmpty()}">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Subject</th>
                <th>Status</th>
                <th>End Date</th>
                <th>Practices</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="exam, stat : ${exams}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${exam.title}">Title</td>
                <td th:text="${exam.subject?.name ?: '-'}">Subject</td>
                <td>
                  <span class="badge"
                        th:classappend="${exam.status?.name() == 'PUBLISHED'} ? 'badge-success' :
                                        (${exam.status?.name() == 'DRAFT'} ? 'badge-muted' : 'badge-warning')"
                        th:text="${exam.status}">STATUS</span>
                </td>
                <td th:text="${exam.endAt != null ? #temporals.format(exam.endAt, 'dd MMM yyyy HH:mm') : '-'}">-</td>
                <td th:text="${exam.practices?.size() ?: 0}">0</td>
                <td>
                  <a th:href="@{/teacher/exams/{id}(id=${exam.id})}" class="btn btn-sm btn-secondary">View</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-body" th:unless="${exams != null and !exams.isEmpty()}">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
            </svg>
            <p>No practice exams found. <a th:href="@{/teacher/exams/new}" style="color:var(--primary)">Create a practice exam.</a></p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
