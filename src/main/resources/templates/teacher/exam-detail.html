<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/teacher}">
<head><title>Exam Detail</title></head>
<body>
<span layout:fragment="page-title">Exam Detail</span>
    <main layout:fragment="content" class="page-content">
      <div th:if="${error}" class="alert alert-error" style="margin-bottom:1rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${error}">Error</span>
      </div>

      <div th:if="${exam != null}">
        <div class="page-header">
          <h1 th:text="${exam.title}">Exam Title</h1>
          <div class="action-row">
            <a th:href="@{/teacher/exams}" class="btn btn-secondary">Back</a>
            <a th:href="@{/teacher/exams/{id}/edit(id=${exam.id})}" class="btn btn-primary">Edit</a>
            <form th:action="@{/teacher/exams/{id}/delete(id=${exam.id})}" method="post" style="display:inline">
              <button type="submit" class="btn btn-destructive"
                      onclick="return confirm('Delete this exam?')">Delete</button>
            </form>
          </div>
        </div>

        <!-- Status change form -->
        <div class="card" style="margin-bottom:1.5rem">
          <div class="card-header"><span class="card-title">Change Status</span></div>
          <div class="card-body" style="padding:1rem 1.5rem">
            <form th:action="@{/teacher/exams/{id}/status(id=${exam.id})}" method="post" style="display:flex;gap:0.75rem;align-items:center">
              <select name="status">
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                        th:selected="${exam.status == s}">STATUS</option>
              </select>
              <button type="submit" class="btn btn-primary">Update Status</button>
            </form>
          </div>
        </div>

        <div class="card" style="margin-bottom:1.5rem">
          <div class="card-header"><span class="card-title">Details</span></div>
          <div class="card-body" style="padding:1.5rem">
            <div class="detail-grid">
              <div class="detail-field">
                <span class="detail-label">Title</span>
                <span class="detail-value" th:text="${exam.title}">-</span>
              </div>
              <div class="detail-field">
                <span class="detail-label">Type</span>
                <span class="badge badge-primary" th:text="${exam.type}">-</span>
              </div>
              <div class="detail-field">
                <span class="detail-label">Status</span>
                <span class="badge"
                      th:classappend="${exam.status?.name() == 'PUBLISHED'} ? 'badge-success' : (${exam.status?.name() == 'DRAFT'} ? 'badge-muted' : 'badge-warning')"
                      th:text="${exam.status}">-</span>
              </div>
              <div class="detail-field">
                <span class="detail-label">Subject</span>
                <span class="detail-value" th:text="${exam.subject?.name ?: '-'}">-</span>
              </div>
              <div class="detail-field">
                <span class="detail-label">Start</span>
                <span class="detail-value" th:text="${exam.startAt != null ? #temporals.format(exam.startAt, 'dd MMM yyyy HH:mm') : '-'}">-</span>
              </div>
              <div class="detail-field">
                <span class="detail-label">End</span>
                <span class="detail-value" th:text="${exam.endAt != null ? #temporals.format(exam.endAt, 'dd MMM yyyy HH:mm') : '-'}">-</span>
              </div>
              <div class="detail-field">
                <span class="detail-label">Max Score</span>
                <span class="detail-value" th:text="${exam.maxScore}">-</span>
              </div>
              <div class="detail-field">
                <span class="detail-label">Task Limit</span>
                <span class="detail-value" th:text="${exam.taskLimit}">-</span>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Groups</span>
            <span class="badge badge-muted" th:text="${exam.groups?.size() + ' groups'}">0</span>
          </div>
          <div class="card-body" style="padding:1rem 1.5rem">
            <div th:if="${exam.groups != null and !exam.groups.isEmpty()}" class="subjects-list">
              <span th:each="group : ${exam.groups}" class="badge badge-primary" th:text="${group.name}">Group</span>
            </div>
            <div th:unless="${exam.groups != null and !exam.groups.isEmpty()}" class="badge badge-muted">No groups assigned</div>
          </div>
        </div>
      </div>

      <div th:unless="${exam != null}">
        <a th:href="@{/teacher/exams}" class="btn btn-secondary" style="margin-bottom:1rem">Back to Exams</a>
      </div>
    </main>
</body>
</html>
