<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/teacher}">
<head><title>My Groups</title></head>
<body>
<span layout:fragment="page-title">My Groups</span>
    <main layout:fragment="content" class="page-content">
      <div class="page-header">
        <h1>My Groups</h1>
        <p>Study groups assigned to you</p>
      </div>
      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${error}">Error</span>
      </div>
      <div th:if="${groups != null and !groups.isEmpty()}" class="groups-grid">
        <div th:each="group : ${groups}" class="group-card">
          <div class="group-card-header">
            <div class="group-name" th:text="${group.name}">Group Name</div>
            <span class="badge badge-primary" th:text="${group.language}">LANG</span>
          </div>
          <div th:if="${group.description}" class="group-description" th:text="${group.description}">Description</div>
          <div class="group-meta">
            <div class="group-meta-item">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
              <span th:text="${group.students?.size() + ' students'}">0 students</span>
            </div>
          </div>
        </div>
      </div>
      <div th:unless="${groups != null and !groups.isEmpty()}" class="card">
        <div class="card-body">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <p>No groups assigned</p>
          </div>
        </div>
      </div>
    </main>
</body>
</html>
