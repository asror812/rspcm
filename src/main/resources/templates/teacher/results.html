<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/teacher}">
<head><title>Results</title></head>
<body>
<span layout:fragment="page-title">Results</span>
    <main layout:fragment="content" class="page-content">
      <div class="page-header">
        <h1>Results</h1>
        <p>Student grades and exam results</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Error</span>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Question-Type Exams</span>
          <span class="badge badge-muted" th:text="${exams?.totalElements ?: 0} + ' exams'">0 exams</span>
        </div>
        <div class="table-wrapper" th:if="${exams != null and !exams.isEmpty()}">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Title</th>
                <th>Subject</th>
                <th>Status</th>
                <th>End Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="exam, stat : ${exams}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${exam.title}">Title</td>
                <td th:text="${exam.subject?.name ?: '-'}">Subject</td>
                <td>
                  <span class="badge"
                        th:classappend="${exam.status?.name() == 'PUBLISHED'} ? 'badge-success' :
                                        (${exam.status?.name() == 'DRAFT'} ? 'badge-muted' : 'badge-warning')"
                        th:text="${exam.status}">STATUS</span>
                </td>
                <td th:text="${exam.endAt != null ? #temporals.format(exam.endAt, 'dd MMM yyyy HH:mm') : '-'}">-</td>
                <td>
                  <a th:href="@{/teacher/exams/{id}(id=${exam.id})}" class="btn btn-sm btn-secondary">View Attempts</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-body" th:unless="${exams != null and !exams.isEmpty()}">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            <p>No question-type exams found. <a th:href="@{/teacher/exams/new}" style="color:var(--primary)">Create an exam.</a></p>
          </div>
        </div>
      </div>
    </main>
</body>
</html>
