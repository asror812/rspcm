<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/teacher}">
<head><title>Dashboard</title></head>
<body>
<span layout:fragment="page-title">Dashboard</span>
    <main layout:fragment="content" class="page-content">
      <div class="page-header">
        <h1 th:text="'Welcome, ' + ${currentUser?.firstName}">Welcome</h1>
        <p>Your teaching overview</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span th:text="${error}">Error</span>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">My Groups</div>
            <div class="stat-value" th:text="${groups?.size() ?: 0}">0</div>
          </div>
          <div class="stat-icon stat-icon-purple">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-card-body">
            <div class="stat-label">Pending Reports</div>
            <div class="stat-value" th:text="${recentReports?.totalElements ?: 0}">0</div>
          </div>
          <div class="stat-icon stat-icon-yellow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          </div>
        </div>
      </div>

      <div class="dashboard-grid">
        <!-- My Groups -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">My Groups</span>
            <a th:href="@{/teacher/groups}" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div class="card-body">
            <div th:if="${groups != null and !groups.isEmpty()}" class="task-list">
              <div th:each="group : ${groups}" class="task-item">
                <div class="task-item-info">
                  <div class="task-item-title" th:text="${group.name}">Group</div>
                  <div class="task-item-deadline">
                    <span th:text="${group.students?.size() + ' students'}">0 students</span>
                  </div>
                </div>
                <span class="badge badge-primary" th:text="${group.language}">LANG</span>
              </div>
            </div>
            <div th:unless="${groups != null and !groups.isEmpty()}" class="empty-state">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
              <p>No groups assigned yet</p>
            </div>
          </div>
        </div>

        <!-- Recent Reports -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Recent Reports</span>
            <a th:href="@{/teacher/reports}" class="btn btn-outline btn-sm">View All</a>
          </div>
          <div class="table-wrapper">
            <table th:if="${recentReports != null and !recentReports.isEmpty()}">
              <thead>
                <tr>
                  <th>Exam</th>
                  <th>Student</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="report : ${recentReports}">
                  <td th:text="${report.examTitle}">Title</td>
                  <td th:text="${report.submittedBy?.firstName + ' ' + report.submittedBy?.lastName}">Student</td>
                  <td>
                    <span class="badge"
                          th:classappend="${report.status?.name() == 'GRADED'} ? 'badge-success' : (${report.status?.name() == 'SUBMITTED'} ? 'badge-warning' : 'badge-muted')"
                          th:text="${report.status}">STATUS</span>
                  </td>
                </tr>
              </tbody>
            </table>
            <div th:unless="${recentReports != null and !recentReports.isEmpty()}" class="empty-state">
              <p>No reports yet</p>
            </div>
          </div>
        </div>
      </div>
    </main>
</body>
</html>
