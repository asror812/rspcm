<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teams — RSPCM Teacher</title>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
  <style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');</style>
</head>
<body>
<div class="app-layout">
  <div th:replace="~{fragments/teacher-sidebar :: teacherSidebar('teams')}"></div>
  <div id="sidebarOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;"
       onclick="document.querySelector('.sidebar').classList.remove('open');this.style.display='none'"></div>
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button id="sidebarToggle" class="sidebar-toggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="topbar-title">Teams</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-avatar"
             th:text="${currentUser != null ? #strings.substring(currentUser.firstName, 0, 1) + #strings.substring(currentUser.lastName, 0, 1) : 'TC'}">TC</div>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <h1>Teams</h1>
        <p>Student practice participation teams</p>
      </div>

      <div th:if="${error}" class="alert alert-error">
        <span th:text="${error}">Error</span>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">All Participations</span>
          <span class="badge badge-muted" th:text="${participations?.size() ?: 0} + ' total'">0 total</span>
        </div>
        <div class="table-wrapper" th:if="${participations != null and !participations.isEmpty()}">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Practice</th>
                <th>Exam</th>
                <th>Work Mode</th>
                <th>Team Size</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p, stat : ${participations}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${p.practice?.name ?: '-'}">Practice</td>
                <td th:text="${'Exam #' + p.examId}">Exam</td>
                <td th:text="${p.practice?.workMode ?: '-'}">MODE</td>
                <td>
                  <span th:if="${p.team != null}"
                        th:text="${p.team?.membersCount + '/' + (p.team?.maxMembers ?: '?')}">0/0</span>
                  <span th:unless="${p.team != null}">Individual</span>
                </td>
                <td>
                  <span class="badge"
                        th:classappend="${p.status?.name() == 'PRACTICE_CHOSEN'} ? 'badge-success' :
                                        (${p.status?.name() == 'WAITING_MEMBERS'} ? 'badge-warning' : 'badge-muted')"
                        th:text="${p.status}">STATUS</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-body" th:unless="${participations != null and !participations.isEmpty()}">
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/>
            </svg>
            <p>No participations found for your practice exams.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
